name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'server/**'
      - 'render.yaml'
      - '*.md'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: |
          npm install
          npx expo install --fix

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Generar proyecto Android nativo
        run: npx expo prebuild --platform android --no-install

      - name: Diagnóstico de módulos nativos
        continue-on-error: true
        run: |
          npx expo-modules-autolinking resolve --platform android --json > /tmp/autolinking.json
          node -e "const j=require('/tmp/autolinking.json');(j.modules||[]).forEach((m,i)=>(m.projects||[]).forEach(p=>console.log('MOD',i,m.packageName,m.packageVersion,JSON.stringify(p.publication))))"

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeApp-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
